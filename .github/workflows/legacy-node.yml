name: 'Legacy Node.js compatibility'

# The service runs on the TV's own Node.js, which is as old as 0.10 (webOS 3.x).
# Build the bundle with a current Node.js, then load and exercise it under the
# real old runtimes with tests/legacy/smoke.js.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Build service bundle
        run: npm run build-service -- --env production

      - uses: actions/upload-artifact@v4
        with:
          name: service-bundle
          path: dist/services/
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # webOS 3.x ships 0.12 (some 0.10); 4.x-6.x ship 8; newer firmware 12+.
        node: ['0.10.48', '0.12.18', '4.9.1', '8.17.0', '12.22.12']
    name: smoke (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: service-bundle
          path: dist/services/

      - name: Install Node.js ${{ matrix.node }}
        shell: bash
        run: |
          set -euo pipefail
          v="${{ matrix.node }}"
          base="https://nodejs.org/dist/v${v}"
          curl -fsSL -o /tmp/node.tar.gz "${base}/node-v${v}-linux-x64.tar.gz"
          curl -fsSL -o /tmp/SHASUMS256.txt "${base}/SHASUMS256.txt"
          (cd /tmp && grep " node-v${v}-linux-x64.tar.gz\$" SHASUMS256.txt | sha256sum -c)
          mkdir -p "$HOME/legacy-node"
          tar -xzf /tmp/node.tar.gz -C "$HOME/legacy-node" --strip-components=1
          "$HOME/legacy-node/bin/node" --version

      - name: Run smoke test under Node.js ${{ matrix.node }}
        shell: bash
        run: |
          chmod +x dist/services/elevate-service
          "$HOME/legacy-node/bin/node" tests/legacy/smoke.js dist/services
